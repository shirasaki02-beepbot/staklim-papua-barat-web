# Web Stasiun Klimatologi Papua Barat - header keamanan (setara _headers di Cloudflare)
charset utf-8;
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-/CHSJd0eN8jL/5938Wamln6iO/O/4tDYNS2QD+BeqzY=' 'sha256-FcGPXpGmF4+FNDK/NMPLuppEJnbJgnIV0UEKhmM7kLU=' https://cdnjs.cloudflare.com https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https:; frame-src https://www.google.com https://maps.google.com https://challenges.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
# alamat uji (devbmkg) jangan masuk Google; HAPUS baris berikut saat sudah memakai alamat resmi bmkg.go.id
add_header X-Robots-Tag "noindex, nofollow" always;
